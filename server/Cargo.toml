[package]
name = "dirigent"
version = "0.1.0"
edition = "2021"

[dependencies]
genai = "=0.7.0-beta.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "process", "fs", "io-util"] }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = "0.7"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
ignore = "0.4"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
libc = "0.2"

[build-dependencies]
tonic-prost-build = "0.14"
protox = "0.9"

[dev-dependencies]
tempfile = "3"
http = "1"
