# The chart's own images and the chart, built in nixbuild.net's store (the runner evaluates the
# flake and gets only the archives, as its disk is too small for everything the builds need) and
# pushed to GHCR by nix/push-images.sh: master as sha-<commit> and master, a v1.2.3 tag as 1.2.3
# (which must be Chart.yaml's version). Pull requests only build.
name: images

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BUILD_STORE: ssh-ng://eu.nixbuild.net
    steps:
      - uses: actions/checkout@v6
      # a release's tag, v1.2.3, is its chart's version and appVersion (Chart.yaml): the chart in
      # git at the tag then pulls the images published for it. It brings logs its player wrote
      # (player/logs/1.2.3, the dev shell's save-log), which the players after it must load.
      - name: Check the release
        if: github.ref_type == 'tag'
        run: |
          want=${GITHUB_REF_NAME#v}
          for key in version appVersion; do
            got=$(sed -n "s/^$key: //p" chart/dirigent/Chart.yaml)
            [ "$got" = "$want" ] \
              || { echo "::error file=chart/dirigent/Chart.yaml::$key is $got, the tag $GITHUB_REF_NAME wants $want"; exit 1; }
          done
          compgen -G "player/logs/$want/*.jsonl" >/dev/null \
            || { echo "::error::no logs in player/logs/$want: save some its player wrote (save-log)"; exit 1; }
      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ github.token }}
            extra-substituters = https://openmig.cachix.org
            extra-trusted-public-keys = openmig.cachix.org-1:Aq6s2uCRbfkN/M9U2czjzjjWrOZVopfe1rv5+1cxLpo=
      - uses: nixbuild/nixbuild-action@v27
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
          # where nixbuild.net's store substitutes from: openmig's cache too
          settings: |
            substituters = https://cache.nixos.org/ https://openmig.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= openmig.cachix.org-1:Aq6s2uCRbfkN/M9U2czjzjjWrOZVopfe1rv5+1cxLpo=
      - name: Build
        if: github.event_name == 'pull_request'
        run: |
          nix build --store "$BUILD_STORE" --eval-store auto --builders "" --max-jobs 2 \
            --no-link --print-build-logs .#chart \
            .#{control,web,tools,player-vm}-image
      - name: Push
        if: github.event_name != 'pull_request'
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags=("${GITHUB_REF_NAME#v}")
          else
            tags=("sha-${GITHUB_SHA::7}" "${GITHUB_REF_NAME//\//-}")
          fi
          nix run .#push-images -- "${tags[@]}"
