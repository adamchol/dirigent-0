# A release: the merge of a `release/*` pull request that bumps Chart.yaml's version is tagged
# vX.Y.Z (which images.yml, homebrew.yml and cachix.yml publish), when e2e.yml's `kube` and `stack`
# passed on the PR's last commit and the merge is that commit's tree. The tag is pushed with
# RELEASE_TOKEN, as a tag pushed with the workflow's own token starts no workflows.
name: release

on:
  push:
    branches: [master]
    paths: [chart/dirigent/Chart.yaml]

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          version=$(sed -n 's/^version: //p' chart/dirigent/Chart.yaml)
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag exists"
            exit 0
          fi
          pr=$(gh api "repos/$REPO/commits/$GITHUB_SHA/pulls" \
            -q '[.[] | select(.merged_at != null and (.head.ref | startswith("release/")))][0].number // empty')
          if [ -z "$pr" ]; then
            echo "::error::$GITHUB_SHA bumps the version to $version but isn't a merged release/* PR: not released"
            exit 1
          fi
          head=$(gh api "repos/$REPO/pulls/$pr" -q .head.sha)
          git fetch -q origin "refs/pull/$pr/head"
          if [ "$(git rev-parse "$GITHUB_SHA^{tree}")" != "$(git rev-parse "$head^{tree}")" ]; then
            echo "::error::the merge of #$pr isn't the commit its tests ran on ($head): not released"
            exit 1
          fi
          for job in kube stack; do
            got=$(gh api "repos/$REPO/commits/$head/check-runs?check_name=$job" \
              -q '[.check_runs[] | select(.app.slug == "github-actions")][0].conclusion // "missing"')
            if [ "$got" != success ]; then
              echo "::error::e2e's $job on #$pr ($head) is $got: not released"
              exit 1
            fi
          done
          git tag "$tag"
          git push origin "$tag"
          echo "released $tag from #$pr"
