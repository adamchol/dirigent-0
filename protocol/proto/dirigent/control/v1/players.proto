// How a player holds a session, from dirigent's control plane: a lease, kept for as long as the
// player's `Lease` call is open. A session with a lease is active, one without idle. Control
// starts a player by reserving the lease for it first (an epoch), which the player then resumes.
syntax = "proto3";

package dirigent.control.v1;

service Players {
  // The player's first message asks for the session; control answers `Acquired`, or ends the
  // call with a status:
  //   NOT_FOUND            there's no such session
  //   FAILED_PRECONDITION  another player holds it
  //   ABORTED              the lease the player resumes is gone (it expired, or the session was
  //                        stopped meanwhile): the player must stop
  // The player ending its stream gives the lease back (after a `Handoff`, to the next player
  // control starts); the call breaking (the connection lost, HTTP/2 keepalive timing out) keeps
  // it for a grace period, in which the same player may resume it with its epoch. Each new
  // holder gets the session's next epoch. A control that leases only the players it started
  // (`--reserved-only`) ends an `Acquire` without an epoch with PERMISSION_DENIED.
  rpc Lease(stream FromPlayer) returns (stream ToPlayer);
}

message FromPlayer {
  oneof msg {
    Acquire acquire = 1;
    Handoff handoff = 2;
    RefreshTokens refresh_tokens = 3;
  }
}

// Any time after `Acquired`: credentials afresh now, answered with `Tokens`. `rejected`: the
// model provider refused its access token (`Tokens.openai`), which control renews rather than
// sending again.
message RefreshTokens {
  bool rejected = 1;
}

// Sent last, before ending the stream: the player is stopped from outside (its machine is
// going: a node drained, its VM deleted), not by control. The session stays active: control
// starts the next player, unless the session was stopped meanwhile.
message Handoff {}

// Hold `session` (a UUID) as `player` (its id; to chlive and in the session's grants it's the
// subject `player:<id>`).
message Acquire {
  string session = 1;
  string player = 2;
  // The lease it resumes: one control reserved for it, or the one it held before its connection
  // broke. It gets that lease back or none, never a new one. Absent: the session, if it's free.
  optional int64 epoch = 3;
}

message ToPlayer {
  oneof msg {
    Acquired acquired = 1;
    Detach detach = 2;
    Tokens tokens = 3;
  }
}

// The player holds the session, as its `epoch`th player, and runs `spec`.
message Acquired {
  int64 epoch = 1;
  SessionSpec spec = 2;
  reserved 3;
  Tokens tokens = 4;
}

// The player's credentials, signed by control and good for minutes: in `Acquired`, then sent
// afresh well before they expire, for as long as the lease is held.
message Tokens {
  // For chlive, as `player:<id>`.
  string player = 1;
  // A dirigent's: for chlive and control's API, as the session's owner, whom it acts for (the
  // player in its `act` claim).
  optional string owner = 2;
  // A ChatGPT-plan session's: an access token of its owner's plan for OpenAI's Responses API,
  // renewed by control (with a quarter of an hour left at least); or, none, why there's none.
  optional string openai = 3;
  optional string openai_unavailable = 4;
  // An Anthropic session's: its owner's API key, or the install's; or, none, why there's none.
  optional string anthropic = 5;
  optional string anthropic_unavailable = 6;
  // The session's secrets, by name: its own, and its owner's for all their sessions (the
  // session's winning), for its tools' environment. Sent again at once when they change.
  map<string, string> secrets = 7;
}

// Any time after `Acquired`: the session was stopped. The player finishes the turn running
// (`now`: cancels it), then gives the lease back.
message Detach {
  bool now = 1;
}

// What a session runs, set when it's made and fixed from then on.
message SessionSpec {
  string model = 1;
  // Absent: no extended thinking.
  optional Effort effort = 2;
  // Where the workspace's files come from; none, an empty workspace.
  oneof source {
    GitSource git = 3;
  }
  // What its player plays (unspecified: a coder).
  Part part = 4;
  // Who its model calls are paid to (unspecified: Anthropic).
  Provider provider = 5;
}

enum Provider {
  PROVIDER_UNSPECIFIED = 0;
  // Anthropic's API, with the owner's API key, or the install's.
  PROVIDER_ANTHROPIC = 1;
  // OpenAI's Responses API, paid with the session owner's ChatGPT plan.
  PROVIDER_CHATGPT = 2;
}

enum Part {
  PART_UNSPECIFIED = 0;
  PART_CODER = 1;
  PART_DIRIGENT = 2;
}

enum Effort {
  EFFORT_UNSPECIFIED = 0;
  EFFORT_LOW = 1;
  EFFORT_MEDIUM = 2;
  EFFORT_HIGH = 3;
  EFFORT_MAX = 4;
}

// A public repository, cloned at `ref` (a branch or tag; absent, its default branch).
message GitSource {
  string url = 1;
  optional string ref = 2;
}
