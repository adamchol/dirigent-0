[package]
name = "dirigent-protocol"
version = "0.1.0"
edition = "2021"
description = "A session's events and how they're kept in the event system"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"

[build-dependencies]
protox = "0.10"
tonic-prost-build = "0.14"
