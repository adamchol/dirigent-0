[package]
name = "dirigent-protocol"
version = "0.1.0"
edition = "2021"
description = "A session's events and how they're kept in the event system"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
