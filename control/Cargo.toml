[package]
name = "dirigent-control"
version = "0.1.0"
edition = "2021"
description = "dirigent's control plane: sessions, who may use them, and the players' leases, in Postgres"

[[bin]]
name = "control"
path = "src/main.rs"

[dependencies]
dirigent-protocol = { path = "../protocol" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "process", "io-util"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1"] }
uuid = { version = "1", features = ["serde", "v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tonic = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# credentials (src/token.rs, src/auth.rs): Ed25519 JWTs of control's, and an OpenID provider's ID
# tokens, verified with its JWKS (rust_crypto: pure Rust, as chlive)
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
async-trait = "0.1"
# the KubeVirt runner (src/runner.rs): players in VirtualMachineInstances, as dynamic objects
# (no generated CRD types), on aws-lc-rs as reqwest is (two rustls providers and neither is picked);
# k8s-openapi's earliest version, for the broadest range of clusters
kube = { version = "5", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs"] }
k8s-openapi = { version = "0.29", features = ["v1_33"] }

[dev-dependencies]
tempfile = "3"
libc = "0.2"
