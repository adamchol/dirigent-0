[package]
name = "dirigent-control"
version = "0.1.0"
edition = "2021"
description = "dirigent's control plane: sessions, who may use them, and the players' leases, in Postgres"

[[bin]]
name = "control"
path = "src/main.rs"

[dependencies]
dirigent-protocol = { path = "../protocol" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1"] }
uuid = { version = "1", features = ["serde", "v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
futures = "0.3"
tokio-tungstenite = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
