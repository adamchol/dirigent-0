[package]
name = "dirigent-chat"
version = "0.1.0"
edition = "2021"
description = "Temporary terminal client for dirigent's gRPC session"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio-stream = "0.1"
futures = "0.3"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
anyhow = "1"

[build-dependencies]
tonic-prost-build = "0.14"
protox = "0.9"
