[package]
name = "dirigent-chat"
version = "0.1.0"
edition = "2021"
description = "Terminal client for a dirigent session"

[dependencies]
dirigent-protocol = { path = "../protocol" }
chlive-client = { git = "https://github.com/dialohq/chlive", branch = "all-in" }
rdkafka = { version = "0.39", default-features = false, features = ["tokio", "dynamic-linking"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
futures = "0.3"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
anyhow = "1"
