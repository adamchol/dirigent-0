[package]
name = "dirigent-player"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "player"
path = "src/main.rs"

[dependencies]
dirigent-protocol = { path = "../protocol" }
dirigent-sync = { path = "../sync" }
genai = "=0.7.4"
chlive-client = { git = "https://github.com/dialohq/chlive", branch = "master" }
tonic = "0.14"
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "process", "fs", "io-util"] }
tokio-util = "0.7"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
ignore = "0.4"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "3"
http = "1"
# a fake of OpenAI's Responses API (provider::genai's tests)
axum = "0.8"
