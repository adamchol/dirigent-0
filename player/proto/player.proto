syntax = "proto3";

package player.v1;

service Player {
  // Opening the stream starts a session; closing it ends the session.
  // Only one session at a time: a second client gets FAILED_PRECONDITION.
  rpc Session(stream Input) returns (stream Event);
}

message Input {
  oneof kind {
    UserMessage message = 1;
    Interrupt interrupt = 2;
  }
}

message Event {
  // Unix time in microseconds when the event was published.
  int64 ts_micros = 1;
  oneof kind {
    UserMessage user_message = 2;
    Interrupt user_interrupt = 3;
    AssistantMessage assistant_message = 4;
    ModelCancelled model_cancelled = 5;
    Error error = 6;
    ToolResult tool_result = 7;
    TurnEnded turn_ended = 8;
    ModelDelta model_delta = 9;
  }
}

// One streaming piece of the reply in progress. For live display only: the
// finished AssistantMessage that follows carries the complete content.
message ModelDelta {
  oneof kind {
    BlockStart block_start = 1;
    TextDelta text = 2;
    TextDelta thinking = 3;
    ToolArgs tool_args = 4;
    BlockData block_data = 5;
    BlockStop block_stop = 6;
    Usage usage = 7;
    string stop_reason = 8;
  }
}

message BlockStart {
  uint32 index = 1;
  ContentBlock block = 2;
}

message TextDelta {
  uint32 index = 1;
  string text = 2;
}

// Tool-call arguments accumulated so far (replaces earlier ones for the index).
message ToolArgs {
  uint32 index = 1;
  string json = 2;
}

message BlockData {
  uint32 index = 1;
  string provider_data_json = 2;
}

message BlockStop {
  uint32 index = 1;
}

message UserMessage {
  string text = 1;
}

message Interrupt {}

message AssistantMessage {
  repeated ContentBlock content = 1;
  // end_turn | max_tokens | tool_use | refusal | context_overflow | provider-specific raw value
  string stop_reason = 2;
  Usage usage = 3;
}

message ContentBlock {
  oneof kind {
    Text text = 1;
    Thinking thinking = 2;
    ToolCall tool_call = 3;
  }
}

message Text {
  string text = 1;
}

message Thinking {
  string text = 1;
  // Opaque provider data (e.g. Anthropic signature) as JSON; empty when absent.
  string provider_data_json = 2;
}

message ToolCall {
  string id = 1;
  string name = 2;
  string input_json = 3;
}

message Usage {
  uint64 input = 1;
  uint64 output = 2;
  uint64 cache_read = 3;
  uint64 cache_write = 4;
}

message ModelCancelled {}

message Error {
  string message = 1;
  bool retryable = 2;
}

message ToolResult {
  string call_id = 1;
  string name = 2;
  string content = 3;
  bool is_error = 4;
  // Tool-specific details (exit code, duration, ...) as JSON; empty when absent.
  string meta_json = 5;
}

message TurnEnded {
  TurnEndReason reason = 1;
}

enum TurnEndReason {
  TURN_END_REASON_UNSPECIFIED = 0;
  TURN_END_REASON_COMPLETED = 1;
  TURN_END_REASON_ABORTED = 2;
  TURN_END_REASON_FAILED = 3;
}
