apiVersion: v1
kind: Service
metadata:
  name: dirigent-web
  labels:
    {{- include "dirigent.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "dirigent.selector" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dirigent-web
  labels:
    {{- include "dirigent.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "dirigent.selector" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "dirigent.selector" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- include "dirigent.pullSecrets" . | nindent 6 }}
      containers:
        - name: web
          image: {{ include "dirigent.image" (list . "web") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: CONTROL, value: "http://dirigent-control:8090" }
            - { name: CHLIVE_URL, value: "ws://dirigent-chlive:8080/live" }
          readinessProbe:
            httpGet: { path: /, port: http }
{{- with .Values.web.ingress }}
{{- if .enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dirigent-web
  labels:
    {{- include "dirigent.labels" $ | nindent 4 }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "web.ingress.host" .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dirigent-web
                port: { name: http }
{{- end }}
{{- end }}
{{- with .Values.web.httpRoute }}
{{- if .enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dirigent-web
  labels:
    {{- include "dirigent.labels" $ | nindent 4 }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .parentRefs | nindent 4 }}
  {{- with .hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { name: dirigent-web, port: 80 }
      {{- with .timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
