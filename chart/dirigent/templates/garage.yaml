{{- if .Values.checkpoints.garage.enabled }}
{{- /* A single-node Garage for the checkpoints, instead of your S3: it lays itself out and makes
the bucket with the key in dirigent-garage (`--single-node --default-bucket`), which control
makes (`control ensure-secrets --garage`); its RPC secret is a single node's, unused. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dirigent-garage
  labels:
    {{- include "dirigent.labels" . | nindent 4 }}
data:
  # us-east-1, the region S3 clients sign for when given none (kopia, curl)
  garage.toml: |
    metadata_dir = "/data/meta"
    data_dir = "/data/data"
    db_engine = "lmdb"
    replication_factor = 1
    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"

    [s3_api]
    s3_region = "us-east-1"
    api_bind_addr = "[::]:3900"
---
apiVersion: v1
kind: Service
metadata:
  name: dirigent-garage
  labels:
    {{- include "dirigent.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "dirigent.selector" . | nindent 4 }}
    app.kubernetes.io/component: garage
  ports:
    - { name: s3, port: 3900, targetPort: s3 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dirigent-garage
  labels:
    {{- include "dirigent.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage
spec:
  serviceName: dirigent-garage
  replicas: 1
  selector:
    matchLabels:
      {{- include "dirigent.selector" . | nindent 6 }}
      app.kubernetes.io/component: garage
  template:
    metadata:
      labels:
        {{- include "dirigent.selector" . | nindent 8 }}
        app.kubernetes.io/component: garage
    spec:
      containers:
        - name: garage
          {{- with .Values.checkpoints.garage.image }}
          image: "{{ .repository }}:{{ .tag }}"
          imagePullPolicy: {{ .pullPolicy }}
          {{- end }}
          command: [/garage, -c, /etc/garage/garage.toml, server, --single-node, --default-bucket]
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom: { secretKeyRef: { name: dirigent-garage, key: rpcSecret } }
            - name: GARAGE_DEFAULT_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: dirigent-garage, key: accessKey } }
            - name: GARAGE_DEFAULT_SECRET_KEY
              valueFrom: { secretKeyRef: { name: dirigent-garage, key: secretKey } }
            - name: GARAGE_DEFAULT_BUCKET
              value: {{ .Values.checkpoints.s3.bucket | quote }}
          ports:
            - { name: s3, containerPort: 3900 }
          readinessProbe:
            tcpSocket: { port: s3 }
          volumeMounts:
            - { name: config, mountPath: /etc/garage, readOnly: true }
            - { name: data, mountPath: /data }
      volumes:
        - name: config
          configMap: { name: dirigent-garage }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.checkpoints.garage.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.checkpoints.garage.storage }}
{{- end }}
