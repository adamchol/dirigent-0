apiVersion: v1
kind: Service
metadata:
  name: dirigent-chlive
  labels:
    {{- include "dirigent.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "dirigent.selector" . | nindent 4 }}
    app.kubernetes.io/component: chlive
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dirigent-chlive
  labels:
    {{- include "dirigent.labels" . | nindent 4 }}
    app.kubernetes.io/component: chlive
spec:
  # one: its Postgres replication slot is its own
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "dirigent.selector" . | nindent 6 }}
      app.kubernetes.io/component: chlive
  template:
    metadata:
      labels:
        {{- include "dirigent.selector" . | nindent 8 }}
        app.kubernetes.io/component: chlive
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/chlive-config.yaml") . | sha256sum }}
    spec:
      initContainers:
        # chlive starts only with every issuer's keys: control's first
        - name: control-keys
          image: {{ include "dirigent.image" (list . "kube-tools") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["bash", "-c"]
          args:
            - timeout 900 bash -c 'until curl -fsS -o /dev/null http://dirigent-control:8090/.well-known/jwks.json; do sleep 2; done'
      {{- if .Values.kafka.existingSecret }}
        # the Kafka credentials (librdkafka properties, e.g. sasl.password) join the config here, so
        # they're only ever in the Secret
        - name: kafka-properties
          image: {{ include "dirigent.image" (list . "kube-tools") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["bash", "-euo", "pipefail", "-c"]
          args:
            - |
              cp /etc/chlive/chlive.toml /run/chlive/chlive.toml
              while IFS= read -r line || [ -n "$line" ]; do
                line=${line%$'\r'}
                case "$line" in ''|'#'*|'!'*) continue ;; esac
                key=${line%%=*}; value=${line#*=}
                printf '%s = %s\n' "$(jq -Rn --arg s "$key" '$s | gsub("^\\s+|\\s+$"; "")')" "$(jq -Rn --arg s "$value" '$s | sub("^\\s+"; "")')"
              done < /etc/kafka/client.properties >> /run/chlive/chlive.toml
          volumeMounts:
            - { name: config, mountPath: /etc/chlive, readOnly: true }
            - { name: kafka, mountPath: /etc/kafka, readOnly: true }
            - { name: run, mountPath: /run/chlive }
      {{- end }}
      containers:
        - name: chlive
          image: {{ include "dirigent.image" (list . "chlive") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: [--config, {{ ternary "/run/chlive/chlive.toml" "/etc/chlive/chlive.toml" (not (empty .Values.kafka.existingSecret)) }}]
          env:
            - name: CHLIVE_RO_PASSWORD
              valueFrom: { secretKeyRef: { name: dirigent-clickhouse, key: chlive_ro } }
            - name: CHLIVE_SNAP_PASSWORD
              valueFrom: { secretKeyRef: { name: dirigent-clickhouse, key: chlive_snap } }
            - name: PG_PASSWORD
              valueFrom: { secretKeyRef: { name: dirigent-chlive-postgres, key: password } }
            - name: CHLIVE_SECURITY__PROVIDERS__PG__URL
              value: "postgres://dirigent_chlive:$(PG_PASSWORD)@dirigent-postgres-rw:5432/dirigent"
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            {{- toYaml .Values.chlive.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/chlive, readOnly: true }
            - { name: cache, mountPath: /var/cache/chlive }
            {{- if .Values.kafka.existingSecret }}
            - { name: run, mountPath: /run/chlive, readOnly: true }
            {{- end }}
      volumes:
        - name: config
          configMap: { name: dirigent-chlive }
        - name: cache
          emptyDir: { sizeLimit: {{ .Values.chlive.cacheSize }} }
        {{- with .Values.kafka.existingSecret }}
        - name: kafka
          secret:
            secretName: {{ . }}
            items:
              - { key: {{ $.Values.kafka.propertiesKey }}, path: client.properties }
        - name: run
          emptyDir: { medium: Memory }
        {{- end }}
