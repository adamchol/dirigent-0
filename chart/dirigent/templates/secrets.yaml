{{- /* Generated once, kept across upgrades. */}}
apiVersion: v1
kind: Secret
metadata:
  name: dirigent-signing-key
  labels:
    {{- include "dirigent.labels" . | nindent 4 }}
data:
  {{- $found := lookup "v1" "Secret" .Release.Namespace "dirigent-signing-key" }}
  {{- if and $found (hasKey $found.data "key.pem") }}
  key.pem: {{ index $found.data "key.pem" }}
  {{- else }}
  key.pem: {{ genPrivateKey "ed25519" | b64enc }}
  {{- end }}
---
{{- /* What users' ChatGPT links (their refresh tokens) are encrypted with in Postgres: 32 random
  bytes, base64 (the file control reads); generated once, kept across upgrades: another would
  leave every link unreadable. */}}
apiVersion: v1
kind: Secret
metadata:
  name: dirigent-link-key
  labels:
    {{- include "dirigent.labels" . | nindent 4 }}
data:
  {{- $link := lookup "v1" "Secret" .Release.Namespace "dirigent-link-key" }}
  {{- if and $link (hasKey $link.data "link.key") }}
  link.key: {{ index $link.data "link.key" }}
  {{- else }}
  link.key: {{ randBytes 32 | b64enc }}
  {{- end }}
---
# ClickHouse's users for chlive and the ingestion, made by the migrations (each password made
# once here: the ingestion's Secrets have them too)
{{- $ch := dict }}
{{- range $user := list "chlive_ro" "chlive_snap" "dirigent_sink" "dirigent_pause" "dirigent_recovery" }}
{{- $_ := set $ch $user (include "dirigent.password" (list $ "dirigent-clickhouse" $user)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: dirigent-clickhouse
  labels:
    {{- include "dirigent.labels" . | nindent 4 }}
stringData:
  {{- range $user, $password := $ch }}
  {{ $user }}: {{ $password | quote }}
  {{- end }}
---
{{- $sink := $ch.dirigent_sink }}
{{- $pause := $ch.dirigent_pause }}
{{- $recovery := $ch.dirigent_recovery }}
apiVersion: v1
kind: Secret
metadata:
  name: dirigent-clickhouse-sink
  labels:
    {{- include "dirigent.labels" . | nindent 4 }}
stringData:
  clickhouse.properties: |
    username=dirigent_sink
    password={{ $sink }}
---
apiVersion: v1
kind: Secret
metadata:
  name: dirigent-clickhouse-pause
  labels:
    {{- include "dirigent.labels" . | nindent 4 }}
stringData:
  clickhouse.properties: |
    username=dirigent_pause
    password={{ $pause }}
---
apiVersion: v1
kind: Secret
metadata:
  name: dirigent-clickhouse-recovery
  labels:
    {{- include "dirigent.labels" . | nindent 4 }}
stringData:
  clickhouse.properties: |
    username=dirigent_recovery
    password={{ $recovery }}
---
# the kopia repository's password
apiVersion: v1
kind: Secret
metadata:
  name: dirigent-kopia-password
  labels:
    {{- include "dirigent.labels" . | nindent 4 }}
stringData:
  password: {{ include "dirigent.password" (list . "dirigent-kopia-password" "password") | quote }}
{{- if and .Values.anthropic.key (not .Values.anthropic.existingSecret) }}
---
# the install's Anthropic API key, given as a value (control's ANTHROPIC_API_KEY)
apiVersion: v1
kind: Secret
metadata:
  name: dirigent-anthropic
  labels:
    {{- include "dirigent.labels" . | nindent 4 }}
stringData:
  key: {{ .Values.anthropic.key | quote }}
{{- end }}
