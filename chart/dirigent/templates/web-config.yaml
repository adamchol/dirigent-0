{{- /* The web UI: static files, with control's API at /api and chlive at /live, one origin. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dirigent-web
  labels:
    {{- include "dirigent.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes 1;
    error_log stderr;
    pid /tmp/nginx.pid;
    events {}
    http {
      access_log off;
      client_body_temp_path /tmp/body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      types {
        text/html html;
        text/css css;
        text/javascript js;
        application/wasm wasm;
        image/svg+xml svg;
      }
      server {
        listen 8080;
        root /srv/web;
        location / {
          try_files $uri /index.html;
        }
        location /api/ {
          proxy_pass http://dirigent-control:8090/;
        }
        location /live {
          proxy_pass http://dirigent-chlive:8080;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_read_timeout 1h;
        }
      }
    }
