{{- /* The kopia repository the players checkpoint their workspaces to, made once (the bucket
too, where it can be; with checkpoints.garage, Garage's layout, bucket and key), with the
checkpoints' policy: `.gitignore`d files and files over 50 MB left out, and no snapshot ever
expires (the log refers to them). Its token, which players connect with, goes in the Secret
`dirigent-kopia` (DIRIGENT_KOPIA_TOKEN). */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dirigent-checkpoints
  labels:
    {{- include "dirigent.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dirigent-checkpoints
  labels:
    {{- include "dirigent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dirigent-checkpoints
  labels:
    {{- include "dirigent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dirigent-checkpoints
subjects:
  - kind: ServiceAccount
    name: dirigent-checkpoints
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dirigent-kopia
  labels:
    {{- include "dirigent.labels" . | nindent 4 }}
    app.kubernetes.io/component: checkpoints
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "dirigent.selector" . | nindent 8 }}
        app.kubernetes.io/component: checkpoints
    spec:
      {{- include "dirigent.pullSecrets" . | nindent 6 }}
      serviceAccountName: dirigent-checkpoints
      restartPolicy: OnFailure
      containers:
        - name: kopia
          image: {{ include "dirigent.image" (list . "tools") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["bash", "-euo", "pipefail", "-c"]
          args:
            - |
              export HOME=/tmp KOPIA_CONFIG_PATH=/tmp/kopia/repo.config KOPIA_CHECK_FOR_UPDATES=false
              scheme=http; tls=(--disable-tls); [ "$S3_TLS" = true ] && { scheme=https; tls=(); }
              if [ -n "${GARAGE_ADMIN:-}" ]; then
                api() {
                  curl -fsS -H "Authorization: Bearer $GARAGE_ADMIN_TOKEN" \
                    -H 'Content-Type: application/json' "$GARAGE_ADMIN/v2/$1" "${@:2}"
                }
                for _ in $(seq 60); do status=$(api GetClusterStatus) && break; sleep 2; done
                # its one node, all the capacity (a single node's is only a weight)
                if [ "$(jq .layoutVersion <<<"$status")" = 0 ]; then
                  api UpdateClusterLayout -d "$(jq -c '{roles: [{id: .nodes[0].id, zone: "dc1",
                    capacity: 1000000000, tags: []}]}' <<<"$status")" >/dev/null
                  api ApplyClusterLayout -d '{"version": 1}' >/dev/null
                fi
                key=$(api "GetKeyInfo?search=dirigent-checkpoints&showSecretKey=true" 2>/dev/null \
                  || api CreateKey -d '{"name": "dirigent-checkpoints"}')
                S3_ACCESS_KEY=$(jq -r .accessKeyId <<<"$key")
                S3_SECRET_KEY=$(jq -r .secretAccessKey <<<"$key")
                bucket=$(api "GetBucketInfo?globalAlias=$S3_BUCKET" 2>/dev/null \
                  || api CreateBucket -d "$(jq -nc --arg b "$S3_BUCKET" '{globalAlias: $b}')")
                api AllowBucketKey -d "$(jq -c --arg k "$S3_ACCESS_KEY" '{bucketId: .id, accessKeyId: $k,
                  permissions: {read: true, write: true, owner: true}}' <<<"$bucket")" >/dev/null
              else
                # the bucket, if it can be made
                for _ in $(seq 60); do
                  code=$(curl -s -o /dev/null -w '%{http_code}' --aws-sigv4 aws:amz:us-east-1:s3 \
                    --user "$S3_ACCESS_KEY:$S3_SECRET_KEY" -X PUT "$scheme://$S3_ENDPOINT/$S3_BUCKET" || true)
                  case "$code" in 200|409) break ;; esac
                  sleep 2
                done
              fi
              s3=(--bucket "$S3_BUCKET" --endpoint "$S3_ENDPOINT" "${tls[@]}"
                --access-key "$S3_ACCESS_KEY" --secret-access-key "$S3_SECRET_KEY" --password "$KOPIA_PASSWORD")
              if ! kopia repository connect s3 "${s3[@]}" >/dev/null 2>&1; then
                kopia repository create s3 "${s3[@]}"
              fi
              kopia policy set --global --add-dot-ignore .gitignore --max-file-size 50000000 \
                --keep-latest 1000000000 --keep-hourly 0 --keep-daily 0 --keep-weekly 0 \
                --keep-monthly 0 --keep-annual 0 >/dev/null
              token=$(kopia repository status -t -s | grep -o -- '--token [^ ]*' | cut -d' ' -f2)
              kubectl create secret generic dirigent-kopia --from-literal=DIRIGENT_KOPIA_TOKEN="$token" \
                --dry-run=client -o yaml | kubectl apply -f -
              echo "the kopia repository is ready"
          env:
            - name: S3_ENDPOINT
              value: {{ include "dirigent.s3Endpoint" . | quote }}
            - name: S3_BUCKET
              value: {{ .Values.checkpoints.s3.bucket | quote }}
            - name: S3_TLS
              value: {{ ternary "false" (toString .Values.checkpoints.s3.tls) .Values.checkpoints.garage.enabled | quote }}
            {{- if .Values.checkpoints.garage.enabled }}
            - name: GARAGE_ADMIN
              value: http://dirigent-garage:3903
            - name: GARAGE_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: dirigent-garage, key: adminToken } }
            {{- else }}
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ required "checkpoints.s3.existingSecret" .Values.checkpoints.s3.existingSecret }}, key: accessKey } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.checkpoints.s3.existingSecret }}, key: secretKey } }
            {{- end }}
            - name: KOPIA_PASSWORD
              valueFrom: { secretKeyRef: { name: dirigent-kopia-password, key: password } }
