[package]
name = "dirigent-cli"
version = "0.1.0"
edition = "2021"
description = "dirigent's command line: signing in, and linking accounts that pay for sessions"

[[bin]]
name = "dirigent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "process"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
rand = "0.9"

[dev-dependencies]
tempfile = "3"
