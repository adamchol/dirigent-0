# With `kube-test install -f nix/kube-test/system.yaml`: the players' VMs on a system of the
# cluster's own (built in a VM here), with the shared Nix store under theirs, a generation of it
# written a minute after VMs added something.
player:
  nixos:
    files:
      configuration.nix: |
        { pkgs, dirigent, ... }: {
          imports = [ dirigent.defaults ];
          environment.systemPackages = [ pkgs.cowsay ];
          # a unit while a session runs, with its env
          systemd.services.session-mark = {
            wantedBy = [ "dirigent-session.target" ];
            partOf = [ "dirigent-session.target" ];
            serviceConfig = {
              Type = "oneshot";
              RemainAfterExit = true;
              EnvironmentFile = "/run/dirigent/session/env";
            };
            script = ''echo "on $DIRIGENT_SESSION" > /run/session-mark'';
          };
        }
nix:
  shared:
    enabled: true
    # k3s's local-path volumes are on its one node
    accessMode: ReadWriteOnce
    size: 20Gi
    every: 60
    promote: all
